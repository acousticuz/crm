# Serves the built SPA and reverse-proxies the API + websocket on the same
# origin, so the frontend works from any host (localhost / LAN IP / domain)
# without baking an absolute API URL into the bundle. Runs with --network host
# and proxies to the backend on 127.0.0.1:3005.
server {
  listen 8082;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;

  location /api/v1/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://127.0.0.1:3005/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  # Hashed asset filenames change every build, so cache them aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the HTML shell — it points at the current asset hashes, so a
  # stale cached copy is exactly what caused clients to keep loading the old
  # bundle (and hit the old localhost:3005 API URL).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
