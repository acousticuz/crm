upstream acoustic_backend {
  server backend:3001;
}

upstream acoustic_frontend {
  server frontend:80;
}

# HTTP server — Let's Encrypt ACME challenge + redirect to HTTPS.
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server — production traffic. The fullchain/privkey paths assume
# Let's Encrypt issuance via scripts/issue-ssl.sh.
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # Comment these out and add `listen 80 default_server;` above if SSL is
  # not yet provisioned (initial bring-up before issue-ssl.sh runs).
  ssl_certificate     /etc/letsencrypt/live/acoustic/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/acoustic/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # API → NestJS backend.
  location /api/ {
    proxy_pass http://acoustic_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Socket.io websocket upgrade.
  location /socket.io/ {
    proxy_pass http://acoustic_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  # Static frontend (Vite build served by nginx in the frontend container).
  location / {
    proxy_pass http://acoustic_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
