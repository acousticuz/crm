server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA — fall back to index.html on unknown paths so client-side routing works.
  location / {
    try_files $uri /index.html;
  }

  # Long cache for hashed asset files.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
