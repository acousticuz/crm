# Production docker-compose. Everything runs as a container behind nginx with
# Let's Encrypt-issued certificates. The single entrypoint is nginx on
# :80/:443; backend, frontend, and workers are not exposed to the host.
#
# Deploy procedure (M11 README has the full guide):
#   1. cp .env.example .env.prod  + fill in real credentials/secrets
#   2. ./scripts/issue-ssl.sh <domain>      # one-time Let's Encrypt fetch
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   4. docker compose -f docker-compose.prod.yml exec backend pnpm prisma:migrate:deploy
#   5. docker compose -f docker-compose.prod.yml exec backend pnpm prisma:seed-acoustic

services:
  postgres:
    image: postgres:16-alpine
    container_name: acoustic-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: acoustic-prod-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: acoustic-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: acoustic-prod-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TELEPHONY_WORKER_SECRET: ${TELEPHONY_WORKER_SECRET}
      TELEPHONY_WORKER_URL: http://telephony-worker:3008
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telephony-worker:
    build:
      context: .
      dockerfile: docker/telephony-worker.Dockerfile
    container_name: acoustic-prod-telephony
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WORKER_PORT: 3008
      BACKEND_URL: http://backend:3001
      TELEPHONY_WORKER_SECRET: ${TELEPHONY_WORKER_SECRET}
      AMI_MODE: ${AMI_MODE:-mock}
      AMI_HOST: ${AMI_HOST:-}
      AMI_PORT: ${AMI_PORT:-5038}
      AMI_USERNAME: ${AMI_USERNAME:-}
      AMI_PASSWORD: ${AMI_PASSWORD:-}
    depends_on:
      - backend

  ai-worker:
    build:
      context: .
      dockerfile: docker/ai-worker.Dockerfile
    container_name: acoustic-prod-ai
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: http://backend:3001
      TELEPHONY_WORKER_SECRET: ${TELEPHONY_WORKER_SECRET}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_ORIGIN}
        VITE_SOCKET_URL: ${PUBLIC_ORIGIN}
    container_name: acoustic-prod-frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: acoustic-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx-prod/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
