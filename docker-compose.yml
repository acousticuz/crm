# Development infrastructure for Acoustic CRM.
# Brings up the backing services the apps need to run locally:
#   - postgres (Prisma DB)
#   - redis    (BullMQ queues, sockets, cache)
#   - minio    (S3-compatible object storage for call recordings)
#   - nginx    (reverse proxy in front of backend + frontend, mirrors prod layout)
#
# Host ports are parametrized to avoid clashes when other projects run on the
# same machine. Override via .env (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: acoustic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acoustic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acoustic}
      POSTGRES_DB: ${POSTGRES_DB:-acoustic_crm}
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acoustic} -d ${POSTGRES_DB:-acoustic_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: acoustic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: acoustic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-acoustic}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-acoustic-minio-pass}
    ports:
      - "${MINIO_API_HOST_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: acoustic-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-8082}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data:
